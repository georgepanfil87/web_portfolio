# Netlify build configuration.
#
# `ng build` with outputMode "static" emits a prerendered site into
# dist/web_portfolio/browser — there is no server bundle to deploy. The
# @netlify/angular-runtime plugin refuses to run until publish points there.

[build]
  command = "npm run build"
  publish = "dist/web_portfolio/browser"

[build.environment]
  # Angular CLI 21 requires ^20.19.0 || ^22.12.0 || >=24.0.0. Netlify's default
  # image can still be older than that, which fails the install before it starts.
  NODE_VERSION = "22"

# One prerendered route. Anything else resolves to it instead of Netlify's
# default 404 page. Existing files are always served first, so the CV PDF and
# the hashed assets are unaffected.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Angular content-hashes these filenames, so a stale cache is impossible.
# index.html is deliberately left out — it must revalidate on every visit.
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
